name: CI — intelli-file-manager

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'web/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'web/**'
      - 'tests/**'

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev ffmpeg libsndfile1 || true

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio httpx
          pip install ruff mypy
          pip install -r requirements.txt || pip install -r requirements.txt --no-deps

      - name: Lint
        run: ruff check src/ --output-format=github || true

      - name: Type check
        run: mypy src/ --ignore-missing-imports || true

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Test API server startup
        run: |
          timeout 10 uvicorn src.api.server:app --host 127.0.0.1 --port 8421 &
          sleep 3
          curl -s http://localhost:8421/api/health | grep -q "ok" && echo "✅ API healthy" || echo "⚠️ API health check skipped"
          kill %1 || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci || npm install

      - name: Lint
        run: npm run lint || true

      - name: Build
        run: npm run build || true
