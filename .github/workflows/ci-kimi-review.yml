name: CI — intelli-file-manager (Lenient)

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'web/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'web/**'
      - 'tests/**'

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install deps (lenient)
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio httpx || true
          pip install ruff mypy || true
          pip install -r requirements.txt || true

      - name: Lint (non-blocking)
        run: ruff check src/ --output-format=github || true
        continue-on-error: true

      - name: Type check (non-blocking)
        run: mypy src/ --ignore-missing-imports || true
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v --tb=short || pytest test_fixes.py -v --tb=short || true

      - name: Test API server startup (non-blocking)
        run: |
          timeout 10 uvicorn src.api.server:app --host 127.0.0.1 --port 8421 &
          sleep 3
          curl -s http://localhost:8421/api/health || echo "API health check skipped"
          kill %1 || true
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci || npm install || true

      - name: Lint
        run: npm run lint || true

      - name: Build
        run: npm run build || true
